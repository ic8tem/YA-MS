# Fotografie per il videocorso (opzione nascosta --screenshot): tratta e stazione scelte, traffico vero, ora attuale e ora migliore.
# Parte con un push sul ramo "corso" (file .github/corso.txt: QTH DX) e pubblica le fotografie sul ramo "corso-foto".
name: corso
on:
  push:
    branches: [ corso ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Catalogo IAU MDC
        continue-on-error: true
        run: |
          mkdir -p data/cataloghi; f=data/cataloghi/iau_mdc_stabiliti.txt; Y=$(date -u +%Y)
          for u in "https://www.ta3.sk/IAUC22DB/MDC2022/Etc/streamestablisheddata$Y.txt" "https://iaumdc.ta3.sk/downloads/lists_shw_data/streamestablisheddata.txt"; do
            if curl -fsSL -m 60 -o "$f.tmp" "$u" && [ "$(grep -c '^"' "$f.tmp")" -gt 50 ]; then mv "$f.tmp" "$f"; break; fi
          done; rm -f "$f.tmp"
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o publish/linux-x64
      - name: Indici delle tratte e fotografie
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-dejavu-core fonts-noto-core fonts-noto-cjk >/dev/null
          mkdir -p shots
          # ogni riga di .github/corso.txt: NOME QTH DX INIZIO(aaaa-mm-ggThh) ORE LINGUE(separate da virgola)
          while read -r NOME QTH DX T0 NH LANGS; do
            [ -z "$NOME" ] && continue
            mkdir -p shots/$NOME
            rm -rf run; cp -R publish/linux-x64 run
            echo "$QTH $DX" > tratta.txt
            ./run/YA-MS --indici-tratte tratta.txt "$T0" $NH > shots/$NOME/indici.csv || true
            M=$(python3 -c "
          import csv,datetime as d
          r=[x for x in csv.DictReader(open('shots/$NOME/indici.csv'),delimiter=';')]
          b=max(r,key=lambda x:float(x['I_beta']))
          print((d.datetime.strptime('$T0','%Y-%m-%dT%H')+d.timedelta(hours=int(b['ora']),minutes=30)).strftime('%Y-%m-%dT%H:%M'))")
            echo "$M" > shots/$NOME/momento_migliore.txt
            for L in ${LANGS//,/ }; do
              rm -f run/data/config.ini
              timeout 500 xvfb-run -a -s "-screen 0 1920x1080x24" ./run/YA-MS --screenshot "$PWD/shots/$NOME/$L" --lingua $L --qth $QTH --dx $DX --data $M --traffico-vero 5 || true
            done
          done < .github/corso.txt
          ls -R shots | head -60
      - name: Pubblica sul ramo corso-foto
        run: |
          cd shots
          git init -q -b corso-foto
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "foto corso ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" corso-foto:corso-foto
