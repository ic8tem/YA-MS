# temporaneo (ramo prototipo-1.6): scarica la fotografia della schermata di avvio da Wikimedia Commons
# "Perseids meteoroid in 2012" di Simon A. Eugster, CC BY-SA 3.0 (da qui il sito non e' raggiungibile)
name: foto
on:
  push:
    branches: [ prototipo-1.6 ]
    paths: [ '.github/workflows/foto.yml' ]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -A "YA-MS/1.6 (https://github.com/ic8tem/YA-MS)" -o src/Assets/avvio.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Perseids_meteoroid_in_2012.jpg/1920px-Perseids_meteoroid_in_2012.jpg"
          file src/Assets/avvio.jpg; ls -la src/Assets/avvio.jpg
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add src/Assets/avvio.jpg
          git commit -m "Fotografia della schermata di avvio (Simon A. Eugster, CC BY-SA 3.0, Wikimedia Commons)"
          git push origin HEAD:prototipo-1.6
