# Aggiorna solo il testo della release della versione in VERSION (da .github/note-release.md), senza ricompilare.
# Parte quando cambia .github/note-release.md su main, oppure a mano (Actions > Note della release > Run workflow).
name: Note della release
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/note-release.md' ]
permissions:
  contents: write
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna il testo della release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          sed "s/@VER@/$VER/g" .github/note-release.md > note-release.md
          if gh release view "v$VER" >/dev/null 2>&1; then gh release edit "v$VER" --notes-file note-release.md; else echo "release v$VER non ancora pubblicata"; fi
