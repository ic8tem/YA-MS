# Sonda: contenuto del dataset Zenodo 18109759 (HamSCI MSQP agosto 2025, spot PSKReporter)
name: sonda
on:
  push:
    branches: [ sonda ]
jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - name: Elenco dei file
        run: |
          curl -sSL https://zenodo.org/api/records/18109759 -o rec.json
          python3 -c "
          import json;d=json.load(open('rec.json'))
          for f in d['files']: print(f['key'], f['size'], f['links']['self'])
          "
      - name: File TSV e README
        run: |
          python3 -c "
          import json,urllib.request
          d=json.load(open('rec.json'))
          for f in d['files']:
              k=f['key']
              if k.lower().endswith(('.tsv','.rtf','.txt')):
                  urllib.request.urlretrieve(f['links']['self'], k); print('scaricato',k)
          "
          ls -la
          for f in *.rtf *.txt; do [ -e "$f" ] && { echo "=== $f"; head -c 4000 "$f"; echo; }; done
          for f in *.tsv; do
            echo "=== $f"; wc -l "$f"; head -5 "$f"; echo ...; tail -3 "$f"
            python3 - "$f" <<'PY'
          import sys,collections,csv
          f=sys.argv[1]
          r=list(csv.reader(open(f,encoding='utf-8',errors='replace'),delimiter='\t'))
          h=r[0]; print('colonne',len(h),h)
          for i,c in enumerate(h):
              vals=collections.Counter(x[i] for x in r[1:] if len(x)>i)
              print(i,c,'distinti',len(vals),'es',list(vals.most_common(6)))
          PY
          done
