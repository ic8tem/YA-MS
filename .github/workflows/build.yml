# Sonda: verifica del modello con gli spot MSK144 su 6 m del MSQP HamSCI di agosto 2025 (Zenodo 18109759, CC BY 4.0)
name: sonda
on:
  push:
    branches: [ sonda ]
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o app
      - name: Dati
        run: |
          curl -sSL https://zenodo.org/api/records/18109759 -o rec.json
          python3 -c "
          import json,urllib.request
          d=json.load(open('rec.json'))
          for f in d['files']:
              if f['key'].endswith('.tsv'): urllib.request.urlretrieve(f['links']['self'], 'spot.tsv')
          "
          wc -l spot.tsv
      - name: Verifica su 50 MHz
        run: python3 tools/verifica_spot.py spot.tsv ./app/YA-MS 50 54
