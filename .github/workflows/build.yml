# YA-MS - compilazione e installatori per Windows, Linux, Raspberry Pi e Mac.
# A ogni push sul ramo main: solo compilazione di controllo su Linux (i minuti Mac costano 10 volte, Windows 2 volte).
# Con un push sul ramo release (o un tag vX.Y.Z, o avviandolo a mano): installatori per Windows, Linux e Mac;
# con il ramo release o il tag crea anche la Release vX.Y.Z (versione letta dal file VERSION).
name: build

on:
  push:
    branches: [ main, release, prototipo-1.7 ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86      # Windows a 32 bit
            arch: x86
          - rid: win-arm64    # Windows su ARM (PC con Snapdragon)
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ env.VER }} -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ env.VER }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=..\publish\${{ matrix.rid }}" installer\YA-MS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\${{ matrix.rid }}\* -DestinationPath dist\YA-MS-${{ env.VER }}-windows-${{ matrix.arch }}-portatile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r linux-x64 --self-contained true -p:Version=$VER -p:DebugType=none -o publish/linux-x64
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/linux-x64 pkg/YA-MS
          cp installer/linux-install.sh pkg/YA-MS/installa.sh
          cp src/Assets/ya-ms-256.png pkg/YA-MS/ya-ms.png
          chmod +x pkg/YA-MS/installa.sh pkg/YA-MS/YA-MS
          tar -C pkg -czf dist/YA-MS-$VER-linux-x64.tar.gz YA-MS
          bash installer/make-deb.sh linux-x64 "$VER" publish/linux-x64 dist
          sudo apt-get install -y -qq rpm >/dev/null
          bash installer/make-rpm.sh linux-x64 "$VER" dist/ya-ms_${VER}_amd64.deb dist
          bash installer/make-txz.sh linux-x64 "$VER" dist/ya-ms_${VER}_amd64.deb dist
          bash installer/make-arch.sh linux-x64 "$VER" dist/ya-ms_${VER}_amd64.deb dist
          bash installer/make-appimage.sh linux-x64 "$VER" publish/linux-x64 dist
      - name: Prova delle tratte di DJ5HG (Quadrantidi, MS-Geometrie 2004)
        if: github.ref != 'refs/heads/release'
        run: |
          cp -R publish/linux-x64 prova
          timeout 300 ./prova/YA-MS --prova-dj5hg 2>&1 | tee prova_dj5hg.txt || true
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/release'
        with:
          name: prova-dj5hg
          path: prova_dj5hg.txt
      - name: Prova della fonte PSKReporter MQTT (60 s)
        if: github.ref != 'refs/heads/release'
        run: timeout 120 ./publish/linux-x64/YA-MS --prova-mqtt 60 || true
      - name: Fotografie delle linguette (schermo virtuale)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prototipo-1.7')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-dejavu-core fonts-noto-cjk fonts-noto-core >/dev/null
          # ore che mancano alle 01:00 UTC successive (Tauridi alte sulla tratta di prova JN70CN - IN78UO)
          H=$(python3 -c "import datetime as d;n=d.datetime.utcnow();t=(n+d.timedelta(days=1)).replace(hour=1,minute=0,second=0,microsecond=0) if n.hour>=1 else n.replace(hour=1,minute=0,second=0,microsecond=0);print(round((t-n).total_seconds()/3600,2))")
          cp -R publish/linux-x64 run
          TZ=Europe/Rome timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/YA-MS --screenshot "$PWD/shots" --dx IN78UO --ore $H || true
          rm -f run/data/config.ini
          timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/YA-MS --screenshot "$PWD/shots/carattere140" --dx JO62QM --ore 0 --carattere 140 || true
          for L in it en ru ja de nl fr es pt ar hi zh ko; do
            rm -f run/data/config.ini   # ogni prova parte da impostazioni pulite (carattere 100 %)
            timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/YA-MS --screenshot "$PWD/shots/lingua_$L" --dx IN78UO --ore $H --lingua $L || true
          done
          # schemi di colori: le prove sopra sono nello schema predefinito "chiaro"
          for T in scuro scia; do
            rm -f run/data/config.ini
            timeout 180 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/YA-MS --screenshot "$PWD/shots/tema_$T" --dx IN78UO --ore $H --tema $T || true
          done
          ls -la shots || true
          cp run/data/errore_avvio.txt shots/ 2>/dev/null || true
          mkdir -p shots/radar && cp run/data/radar/* shots/radar/ 2>/dev/null || true
          ls run/data/mappa > shots/mappa.txt 2>&1 || true
      - name: Pubblica le fotografie sul ramo ci-screenshots
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prototipo-1.7')
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "fotografie ${GITHUB_SHA::7}"
          # due compilazioni in parallelo possono pubblicare insieme: si riprova, e un errore qui non fa fallire la compilazione
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots:${{ github.ref == 'refs/heads/main' && 'ci-screenshots' || 'ci-screenshots-prototipo' }} && exit 0
            sleep $((i * 15))
          done
          echo "::warning::fotografie non pubblicate (ramo occupato da un'altra compilazione)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  raspberry:
    # Raspberry Pi 3/4/5 e 400/500: 64 bit (linux-arm64, Raspberry Pi OS 64 bit) e 32 bit (linux-arm, Raspberry Pi OS 32 bit).
    # Il 64 bit gira su un processore ARM vero, dove si fa anche una prova di avvio con fotografia.
    strategy:
      matrix:
        include:
          - rid: linux-arm64
            name: raspberry-pi-64bit
            generic: linux-arm64      # stesso programma per ogni Linux ARM64 (es. Slackware ARM64)
            os: ubuntu-24.04-arm
          - rid: linux-arm
            name: raspberry-pi-32bit
            generic: linux-armv7l     # stesso programma per ogni Linux armv7l (armhf)
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/${{ matrix.rid }} pkg/YA-MS
          cp installer/linux-install.sh pkg/YA-MS/installa.sh
          cp src/Assets/ya-ms-256.png pkg/YA-MS/ya-ms.png
          chmod +x pkg/YA-MS/installa.sh pkg/YA-MS/YA-MS
          tar -C pkg -czf dist/YA-MS-$VER-${{ matrix.name }}.tar.gz YA-MS
          tar -C pkg -czf dist/YA-MS-$VER-${{ matrix.generic }}.tar.gz YA-MS
          bash installer/make-deb.sh ${{ matrix.rid }} "$VER" publish/${{ matrix.rid }} dist
          sudo apt-get install -y -qq rpm >/dev/null
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            bash installer/make-rpm.sh linux-arm64 "$VER" dist/ya-ms_${VER}_arm64.deb dist
            bash installer/make-txz.sh linux-arm64 "$VER" dist/ya-ms_${VER}_arm64.deb dist
            bash installer/make-arch.sh linux-arm64 "$VER" dist/ya-ms_${VER}_arm64.deb dist
            bash installer/make-appimage.sh linux-arm64 "$VER" publish/linux-arm64 dist
          else
            bash installer/make-rpm.sh linux-arm "$VER" dist/ya-ms_${VER}_armhf.deb dist
          fi
      - name: Prova di avvio su ARM (schermo virtuale)
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-dejavu-core >/dev/null
          cp -R publish/linux-arm64 run
          timeout 240 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/YA-MS --screenshot "$PWD/shots" --dx IN78UO --ore 0 || true
          cp run/data/errore_avvio.txt shots/ 2>/dev/null || true
          ls -la shots
          ls shots/*.png >/dev/null
      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'linux-arm64' && github.ref == 'refs/heads/main'   # non finisce nella Release
        with:
          name: prova-arm64
          path: shots/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  alpine:
    # Alpine Linux e altre distribuzioni con musl (x86_64 e aarch64), con una prova di avvio in un contenitore Alpine.
    strategy:
      matrix:
        include:
          - rid: linux-musl-x64
            name: alpine-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            name: alpine-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto
        run: |
          mkdir -p dist pkg
          cp -R publish/${{ matrix.rid }} pkg/YA-MS
          cp installer/linux-install.sh pkg/YA-MS/installa.sh
          cp src/Assets/ya-ms-256.png pkg/YA-MS/ya-ms.png
          chmod +x pkg/YA-MS/installa.sh pkg/YA-MS/YA-MS
          tar -C pkg -czf dist/YA-MS-$VER-${{ matrix.name }}.tar.gz YA-MS
      - name: Prova di avvio in Alpine (calcolo delle tratte di DJ5HG, senza grafica)
        run: |
          docker run --rm -v "$PWD/pkg/YA-MS:/p" alpine:latest sh -c "apk add -q icu-libs libstdc++ libgcc fontconfig >/dev/null; cd /p && timeout 200 ./YA-MS --prova-dj5hg 2>&1" > prova_alpine.txt || true
          head -40 prova_alpine.txt
          grep -q "=== quota" prova_alpine.txt || { echo "::error::YA-MS non parte su Alpine"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto YA-MS.app e immagine disco
        run: |
          APP=pkg/YA-MS/YA-MS.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp -R publish/${{ matrix.rid }}/. "$APP/Contents/MacOS/"
          cp -R data "$APP/Contents/Resources/data"
          cp src/Assets/ya-ms.icns "$APP/Contents/Resources/"
          sed "s/__VERSION__/$VER/g" installer/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/YA-MS"
          codesign --force --deep -s - "$APP"
          cp "installer/macos-install.command" "pkg/YA-MS/Installa YA-MS.command"
          chmod +x "pkg/YA-MS/Installa YA-MS.command"
          cp LEGGIMI.txt pkg/YA-MS/
          ARCH=$([ "${{ matrix.rid }}" = "osx-arm64" ] && echo "apple-silicon" || echo "intel")
          hdiutil create -volname "YA-MS" -srcfolder pkg/YA-MS -ov -format UDZO "dist/YA-MS-$VER-mac-$ARCH.dmg"
          # stessa applicazione in uno zip: si estrae dove si vuole, la cartella data nasce accanto a YA-MS.app
          ditto -c -k --keepParent "$APP" "dist/YA-MS-$VER-mac-$ARCH-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ windows, linux, raspberry, alpine, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: YA-MS ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            YA-MS - previsione e calcolo in diretta dell'efficienza degli sciami meteorici per il meteor scatter.
            A cura di Costantino IC8TEM.

            Novità della 1.8.11: colonna unica accanto alla mappa del Calcolo previsionale (corrispondente con il puntamento dell'antenna in alto, legenda in basso); monitor attivi della mappa di PSKReporter nel Traffico in diretta (triangoli vuoti, ogni 5 minuti); FT8 oltre i 1100 km senza tratte parallele in verde chiaro con la riga che lampeggia; spot UDP che mi riguardano tratteggiati e lampeggianti; finestra minima di 3 minuti. Rimando automatico a PSKReporter delle decodifiche MS via UDP quando il programma digitale non le manda (psk_rimando=0 per spegnerlo). CALL3 da MMMonVHF ogni 12 ore; ricerche G7VRD e controllo degli aggiornamenti ogni 30 minuti; tratte parallele FT8 entro 15°. Nuova linguetta Impostazioni (carattere, tema, lingua, aggiornamenti, fonti in diretta, RMOB). CALL3 con lo strato JTDX (grid_data.bin).
            Novità della 1.8.10: messaggi UDP di WSJT-X / JTDX / MSHV come in LIVETROPOVHF (porta 2237, inoltro alla 2238), un solo ricevitore per tutto il programma.
            Novità della 1.8.9: ricerche G7VRD ogni 6 ore; correzioni scritte dentro data/call3.txt (anche quelle di LIVETROPOVHF, tolte dal codice).
            Novità della 1.8.8: CALL3 con l'ultima fonte G7VRD come in LIVETROPOVHF (locatori a 6 caratteri mancanti, accesa di partenza); corrispondente nel riquadro accanto alla mappa del Calcolo previsionale.
            Novità della 1.8.7: corrispondente con nominativo dal CALL3; CALL3 con le regole di LIVETROPOVHF (MMMonVHF ogni 7 giorni, voci a mano, file aggiunti, correzioni dal cluster, LOC6); traffico in diretta con nominativi su entrambi i capi, proiezione di Mercatore e fumetto della Nuvola; barra rossa dell'orario di calcolo; cursore del carattere tra 85 e 140 %.
            Novità della 1.8.6: aggiornamenti automatici e silenziosi (all'avvio e ogni 6 ore); Traffico in diretta con gli spot di tutte le bande; spot CW ed entro 500 km nascosti anche se già in archivio.
            Novità della 1.8.5: spot tra stazioni più vicine di 500 km scartati nella Raccolta dati (non compaiono nella console e non si memorizzano).
            Novità della 1.8.4: spot CW scartati nella Raccolta dati, stazioni in ascolto in MSK144/FSK441/PSK2K/JTMS (PSKReporter MQTT) sulla mappa del Traffico in diretta, 28 e 70 MHz nei filtri di partenza.
            Novità della 1.8.3: casella "diagramma d'antenna" nel riquadro arancione, come l'angolo beta.
            Novità della 1.8.2: lettera del lato Hot (A/B) accanto a ogni valore della previsione dell'efficienza,
            Manuale d'uso in 36 lingue, nuovi pacchetti per Windows ARM, Fedora/openSUSE (.rpm), Arch, Slackware, AppImage, Alpine e Linux ARM.
            Novità della 1.8.1: lobo d'antenna come diagramma verticale (casella "diagramma d'antenna", accesa di partenza: le efficienze non spariscono più sulle tratte lunghe),
            avviso "NESSUNA ZONA COMUNE" con spiegazione, casella dell'angolo beta in evidenza con il suo peso nel fumetto, una sola data del calcolo,
            nuovo Manuale d'uso, "Documenti tecnici" in fondo, confronto con 181 767 spot reali del MSQP 2025 su 50 MHz nei documenti (dettagli nel file LEGGIMI.txt).
            Dalla 1.8.0 il programma si aggiorna da GitHub (pulsante Aggiornamenti, la cartella data resta) e segnala i file mancanti.
            Dalla 1.7.0 in giù il programma non si aggiorna da solo: questa versione va installata a mano, le successive no.

            - Windows: YA-MS-...-windows-x64-setup.exe (installa in C:\YA-MS) oppure lo zip portatile; per Windows a 32 bit i file -windows-x86-, per Windows su ARM (Snapdragon) i file -windows-arm64-.
            - Fedora, openSUSE: ya-ms-....x86_64.rpm (o .aarch64.rpm, .armv7hl.rpm), con: sudo dnf install ./ya-ms-....rpm oppure sudo zypper install ./ya-ms-....rpm.
            - Arch, Manjaro, EndeavourOS, Arch Linux ARM: ya-ms-...-x86_64.pkg.tar.zst (o -aarch64), con: sudo pacman -U ./ya-ms-...pkg.tar.zst.
            - Slackware (x86_64 e ARM64): da root installpkg ya-ms-...-x86_64-1_ic8tem.txz (o -aarch64-).
            - Qualsiasi Linux: YA-MS-...-x86_64.AppImage (o -aarch64): rendere eseguibile e avviare.
            - Alpine Linux (musl): YA-MS-...-alpine-x64.tar.gz o -alpine-arm64.tar.gz (serve apk add icu-libs fontconfig).
            - Linux (Debian, Ubuntu, Mint): ya-ms_..._amd64.deb, con: sudo apt install ./ya-ms_..._amd64.deb (al primo avvio il programma si copia in ~/YA-MS).
              Oppure YA-MS-...-linux-x64.tar.gz: portatile (si avvia ./YA-MS dalla cartella estratta) o installabile con ./installa.sh in ~/YA-MS.
            - Raspberry Pi 3/4/5: ya-ms_..._arm64.deb (Raspberry Pi OS 64 bit) o ya-ms_..._armhf.deb (32 bit); in alternativa YA-MS-...-raspberry-pi-64bit.tar.gz o -32bit.tar.gz.
            - Altri Linux ARM (es. Slackware ARM64, schede armv7l): YA-MS-...-linux-arm64.tar.gz o -linux-armv7l.tar.gz, come il tar.gz per Linux.
            - Mac: YA-MS-...-mac-apple-silicon.dmg (M1/M2/M3/M4) o -mac-intel.dmg: aprire il .dmg, clic destro su "Installa YA-MS.command" > Apri (installa in ~/YA-MS).
              Oppure YA-MS-...-mac-apple-silicon-app.zip / -mac-intel-app.zip: YA-MS.app da estrarre in una cartella a scelta (la cartella data nasce accanto); al primo avvio clic destro > Apri.
          files: dist/*
      - name: Togli dalla Release i file che non sono pacchetti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "v$VER" --json assets -q '.assets[].name' | grep -v -e '^YA-MS-' -e '^ya-ms_' -e '^ya-ms-' | while read -r n; do
            gh release delete-asset "v$VER" "$n" -y
          done
