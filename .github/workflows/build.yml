# Sonda: il codice di main (lobo come diagramma) sulla tratta JN70CN83 -> JO76QP del 14/12/2026, lobo 3 gradi
name: sonda

on:
  push:
    branches: [ sonda ]

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compila
        run: dotnet publish YA-MS.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o app
      - name: Programmi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Fotografie al 14/12/2026 12:00 UTC
        run: |
          printf 'mio_locator=JN70CN83\nmia_quota_m=62\ndx_locator=JO76QP\ndx_quota_m=50\nquota_da_radar=0\nquota_scie_km=88.5\nelevazione_lobo_gradi=3\nboom_m=9.2\nlingua=it\ntema=chiaro\n' > app/data/config.ini
          sudo timedatectl set-ntp false || true
          sudo date -u -s "2026-12-14 12:00:00"
          timeout 300 xvfb-run -a -s "-screen 0 1900x1000x24" ./app/YA-MS --screenshot "$PWD/shots" --dx JO76QP --ore 0 || true
          printf 'mio_locator=JN70CN83\nmia_quota_m=62\ndx_locator=JO76QP\ndx_quota_m=50\nquota_da_radar=0\nquota_scie_km=88.5\nelevazione_lobo_gradi=3\nboom_m=9.2\nlingua=it\ntema=chiaro\nlobo_diagramma=0\n' > app/data/config.ini
          timeout 300 xvfb-run -a -s "-screen 0 1900x1000x24" ./app/YA-MS --screenshot "$PWD/shots/netto" --dx JO76QP --ore 0 || true
          ls shots
      - name: Pubblica
        run: |
          cd shots && git init -q -b r && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "prova main" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" r:prova-main
