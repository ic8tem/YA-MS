# YA-MS - prova di calcolo e lettura di file esterni (solo sul ramo sonda; nessuna release)
name: build
on:
  push:
    branches: [ sonda ]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: compila e calcola
        run: |
          dotnet publish YA-MS.csproj -c Release -r linux-x64 --self-contained true -o out
          mkdir -p sonda
          ./out/YA-MS --confronto-brams > sonda/brams.csv 2>&1 || true
      - name: file esterni
        run: |
          UA="YA-MS (+https://github.com/ic8tem/YA-MS)"
          curl -sSL -A "$UA" https://globalmeteornetwork.org/data/traj_summary_data/daily/traj_summary_latest_daily.txt -o sonda/gmn_daily.txt || true
          curl -sSL -A "$UA" https://globalmeteornetwork.org/flux/ -o sonda/gmn_flux.html || true
          curl -sSL -A "$UA" https://www.ta3.sk/IAUC22DB/MDC2022/Etc/streamestablisheddata2026.txt -o sonda/mdc2026.txt || true
          curl -sSL -A "$UA" https://iaumdc.ta3.sk/downloads/lists_shw_data/streamestablisheddata.txt -o sonda/mdc_latest.txt || true
          ls -la sonda
      - name: stampa
        run: |
          echo "=====BRAMS"; cat sonda/brams.csv
          echo "=====GMNHEAD"; head -c 4000 sonda/gmn_daily.txt; echo; echo "=====GMNCODES"; grep -v '^#' sonda/gmn_daily.txt | cut -d';' -f3-5 | head -5; grep -vc '^#' sonda/gmn_daily.txt
          echo "=====FLUXTABLE"; grep -n -i -A3 "<tr" sonda/gmn_flux.html | head -120
          echo "=====MDC"; grep -m 30 '^:' sonda/mdc2026.txt; grep -m 3 '|' sonda/mdc2026.txt; grep -c '|' sonda/mdc2026.txt sonda/mdc_latest.txt
          echo "=====PERMDC"; grep '"PER"' sonda/mdc2026.txt | cut -c1-400 | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: sonda
          path: sonda
