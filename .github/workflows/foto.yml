# temporaneo (ramo prototipo-1.6): fotografia della schermata di avvio
# "The 2010 Perseids over the VLT", ESO/S. Guisard, CC BY 4.0 (eso.org/public/images/potw1033a)
name: foto
on:
  push:
    branches: [ prototipo-1.6 ]
    paths: [ '.github/workflows/foto.yml' ]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -A "YA-MS/1.6 (https://github.com/ic8tem/YA-MS)" -o src/Assets/avvio.jpg "https://cdn.eso.org/images/wallpaper4/potw1033a.jpg"
          file src/Assets/avvio.jpg
          git rm -q .github/workflows/foto.yml
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A
          git commit -m "Fotografia della schermata di avvio: The 2010 Perseids over the VLT, ESO/S. Guisard, CC BY 4.0"
          git push origin HEAD:prototipo-1.6
